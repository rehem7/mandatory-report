<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f5ee">
  <title>登录 · 强制报告智能体</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/visual.css"><link rel="icon" href="/assets/visual/guardian-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/login.css">
</head>
<body class="login-page">
  <header class="login-header">
    <a class="brand" href="/login"><span class="brand-mark"><img src="/assets/visual/guardian-mark.svg" width="27" height="27" alt=""></span><span>强制报告智能体<span class="brand-caption">保护，从看见开始</span></span></a>
    <a class="login-guest" href="/ask">先以访客使用 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="login-main">
    <div class="login-intro">
      <aside class="login-inspiration" aria-label="孩子值得拥有的日常">
        <div id="login-bounce-cards" class="bounce-cards">
          <div class="bounce-card"><img src="/assets/visual/children-support.svg" alt="父母牵着中间的小孩" width="500" height="500" loading="lazy" fetchpriority="low" draggable="false"><span>陪伴</span></div>
          <div class="bounce-card"><img src="/assets/visual/children-learning.svg" alt="女教师耐心陪伴小学生学习" width="500" height="500" loading="lazy" fetchpriority="low" draggable="false"><span>倾听</span></div>
          <div class="bounce-card"><img src="/assets/visual/children-reading.svg" alt="三个孩子一起阅读" width="500" height="500" loading="lazy" fetchpriority="low" draggable="false"><span>成长</span></div>
          <div class="bounce-card"><img src="/assets/visual/children-care.svg" alt="儿科医生用玩具安抚检查台上的孩子" width="500" height="500" loading="lazy" fetchpriority="low" draggable="false"><span>照顾</span></div>
          <div class="bounce-card"><img src="/assets/visual/children-play.svg" alt="两个孩子扮演小超人和恐龙，在家一起玩耍" width="500" height="500" loading="lazy" fetchpriority="low" draggable="false"><span>欢笑</span></div>
        </div>
      </aside>
      <p class="eyebrow"><span aria-hidden="true"></span>让每一次求助，都有回应</p><h1 id="login-title" class="stroke-title" aria-label="从受伤的此刻，到微笑的未来。"><span data-stroke-line>从受伤的此刻，到微笑的未来。</span></h1><p>看见，是保护的第一步。让每一次勇敢的开口，都得到回应。</p>
    </div>
    <div class="login-layout">
      <figure class="login-portrait portrait-before"><div class="portrait-halo" aria-hidden="true"></div><img src="/assets/login-child-before.png" alt="受伤的孩子低头望着自己的手" width="1728" height="2304" fetchpriority="high"><figcaption><span class="portrait-caption-line" aria-hidden="true"></span><span>让伤害被看见<small>每一份不安，都值得被认真倾听。</small></span></figcaption></figure>
      <section class="login-card" aria-labelledby="auth-title">
        <div class="login-tabs" role="tablist" aria-label="账号入口"><button id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-form">登录</button><button id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form" tabindex="-1">注册</button></div>
        <div class="auth-heading"><h2 id="auth-title">欢迎回来</h2><p id="auth-description">登录后，继续您的对话与报告记录。</p></div>
        <div class="auth-forms">
          <form id="login-form" role="tabpanel" aria-labelledby="login-tab">
            <div class="auth-fields"><label class="field"><span>邮箱</span><input name="email" type="email" required maxlength="254" autocomplete="username" placeholder="请输入注册邮箱"></label><label class="field"><span>密码</span><div class="password-field"><input id="login-password" name="password" type="password" required maxlength="100" autocomplete="current-password" placeholder="请输入密码"><button id="toggle-password" type="button" aria-label="显示密码">显示</button></div></label><p class="login-reassurance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>让记录与保护行动持续相连</p></div>
            <button class="primary auth-submit specular-button" type="submit"><canvas class="specular-button__light" aria-hidden="true"></canvas><span class="specular-button__label"><span class="auth-submit-text">登录并继续</span><span class="auth-submit-arrow" aria-hidden="true">→</span></span></button>
          </form>
          <form id="register-form" role="tabpanel" aria-labelledby="register-tab" hidden>
            <div class="auth-fields">
              <div class="register-details register-contact"><label class="field"><span>邮箱</span><input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="请输入邮箱"></label><label class="field"><span>如何称呼您 <small>选填</small></span><input name="name" maxlength="60" autocomplete="nickname" placeholder="例如：林老师"></label></div>
              <div id="register-identity-details" class="register-details register-identity-details"><label class="field"><span>您的报告身份</span><select id="register-identity" name="identity" required><option value="">请选择身份</option><option>未成年本人</option><option>家长/监护人</option><option>教师/教育工作者</option><option>医护人员</option><option>社区工作人员</option><option>其他</option></select></label><label id="register-other-field" class="field" hidden><span>其他身份说明</span><input id="register-other" name="identityOther" maxlength="100" placeholder="请说明您的身份"></label></div>
              <p class="login-password-note">无需验证码，初始密码为 <strong>123456</strong>。<br>所选身份将用于报告表单，注册后不可修改。</p>
            </div><button class="primary auth-submit specular-button" type="submit"><canvas class="specular-button__light" aria-hidden="true"></canvas><span class="specular-button__label"><span class="auth-submit-text">注册并进入</span><span class="auth-submit-arrow" aria-hidden="true">→</span></span></button>
          </form>
        </div>
        <div class="auth-feedback"><p id="auth-error" class="auth-error" role="alert" hidden></p></div>
        <div class="login-card-bottom"><span>公安及协同部门</span><a id="receiver-login-entry" href="/receiver">进入接收工作台 ↗</a></div>
      </section>
      <figure class="login-portrait portrait-after"><div class="portrait-halo" aria-hidden="true"></div><img src="/assets/login-child-after.png" alt="重新露出微笑的孩子伸出双手" width="1086" height="1448" fetchpriority="high"><figcaption><span class="portrait-caption-line" aria-hidden="true"></span><span>让笑容有未来<small>及时的行动，让保护真正发生。</small></span></figcaption></figure>
    </div>
  </main>
  <footer class="login-footer"><span>智能问答 <i aria-hidden="true">·</i> 线索报告 <i aria-hidden="true">·</i> 情景实训 <i aria-hidden="true">·</i> <a class="login-art-credit" href="https://storyset.com/" target="_blank" rel="noopener noreferrer">Illustrations by Storyset</a></span><span>遇紧急危险，请直接拨打 <strong>110</strong></span></footer>
  <script type="module" src="/login.js"></script>
</body>
</html>
